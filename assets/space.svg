<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Orbiting satellite">
  <rect width="300" height="300" fill="#000"/>
  <g fill="#fff">
    <circle cx="24" cy="30" r="1"/><circle cx="70" cy="252" r="1.2"/><circle cx="262" cy="44" r="1"/>
    <circle cx="210" cy="270" r="0.8"/><circle cx="40" cy="160" r="0.8"/><circle cx="280" cy="180" r="1.1"/>
    <circle cx="150" cy="20" r="0.9"/><circle cx="118" cy="286" r="0.7"/><circle cx="240" cy="120" r="0.7"/>
    <circle cx="90" cy="70" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="220" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="220" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- planet -->
  <circle cx="150" cy="150" r="46" fill="#1c1c1c" stroke="#bbb" stroke-width="1.5"/>
  <path d="M112 136 C130 128 170 130 190 142" stroke="#444" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M108 160 C132 168 168 168 194 158" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="150" cy="150" rx="92" ry="22" fill="none" stroke="#777" stroke-width="1.2" transform="rotate(-18 150 150)"/>

  <!-- orbiting satellite -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="9s" repeatCount="indefinite"/>
    <g transform="translate(150 54)">
      <rect x="-5" y="-5" width="10" height="10" fill="#fff"/>
      <rect x="-19" y="-3" width="12" height="6" fill="none" stroke="#fff" stroke-width="1.2"/>
      <rect x="7" y="-3" width="12" height="6" fill="none" stroke="#fff" stroke-width="1.2"/>
    </g>
  </g>

  <text x="150" y="276" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#888">
    &gt; building_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
